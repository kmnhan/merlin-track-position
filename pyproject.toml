[project]
name = "merlin-track-position"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "h5netcdf>=1.8.1",
    "h5py>=3.15.1",
    "ipykernel>=7.2.0",
    "numpy>=2.4.4",
    "scikit-image>=0.26.0",
    "scipy>=1.17.1",
    "xarray>=2026.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/merlin_track_position"]

[tool.hatch.build.targets.sdist]
include = [
    "src/merlin_track_position",
    "tests",
    "README.md",
]
